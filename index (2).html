<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garage Tycoon – Warsztat Tuningowy</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--card:#151926;--card2:#1d2233;--tx:#e8ecf5;--mut:#8b93aa;--red:#ff2d55;--cy:#00e5ff;--ok:#2ee59d;--warn:#ffcc33;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,#1a1030 0,var(--bg) 55%) fixed;color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;font-size:17px;min-height:100vh}
h1,h2,h3,.o{font-family:Orbitron,Rajdhani,sans-serif;letter-spacing:.04em}
button{font:inherit;cursor:pointer;border:0;color:var(--tx);background:var(--card2);padding:10px 16px;border-radius:10px;transition:.15s}
button:hover{transform:translateY(-2px);box-shadow:0 4px 18px #00e5ff33}button:active{transform:scale(.96)}
button:disabled{opacity:.4;pointer-events:none}
.pri{background:linear-gradient(135deg,var(--red),#c2185b);font-weight:700}.cy{background:linear-gradient(135deg,#00b8d4,#0077b6);font-weight:700}
#menu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#menu h1{font-size:clamp(30px,8vw,64px);margin:0;background:linear-gradient(90deg,var(--red),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #ff2d5533}
#menu p{color:var(--mut);margin:0 0 14px}#menu button{width:260px;padding:14px;font-size:19px}
#game{display:none;max-width:980px;margin:auto;padding:0 12px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;background:#0b0d14ee;backdrop-filter:blur(8px)}
.chip{background:var(--card);border:1px solid #ffffff14;padding:6px 12px;border-radius:99px;font-weight:700}.chip b{color:var(--cy)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#0b0d14f2;border-top:1px solid #ffffff14;z-index:6}
nav button{flex:1;max-width:160px;background:var(--card);font-size:14px;padding:8px 4px}nav button span{display:block;font-size:20px}
nav button.on{background:linear-gradient(135deg,var(--red),#c2185b);box-shadow:0 0 16px #ff2d5566}
.card{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:14px;margin:10px 0;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.m{color:var(--mut);font-size:15px}.g{color:var(--ok)}.r{color:var(--red)}
.bar{height:8px;background:#0006;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--red))}
.tag{font-size:12px;padding:2px 8px;border-radius:9px;background:#fff1;margin-left:4px}
.t-Race{color:var(--red)}.t-Sport{color:var(--warn)}.t-Street{color:var(--cy)}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:3px;border:2px solid #fff3;cursor:pointer;padding:0}
#modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal{background:var(--card);border:1px solid var(--cy);border-radius:18px;padding:20px;max-width:480px;width:100%;box-shadow:0 0 40px #00e5ff33;animation:in .25s}
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:12px;z-index:30;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border-left:4px solid var(--cy);padding:10px 14px;border-radius:8px;animation:in .3s;max-width:300px}
.zone{position:relative;height:36px;background:#0008;border-radius:10px;margin:16px 0;overflow:hidden}
#zn{position:absolute;top:0;bottom:0;background:#2ee59d55;border:2px solid var(--ok)}#mk{position:absolute;top:0;bottom:0;width:6px;background:var(--red);box-shadow:0 0 10px var(--red)}
svg.car{width:100%;max-height:230px}
.scene{width:100%;border-radius:12px;display:block}.clk{cursor:pointer;transition:.15s}.clk:hover{filter:brightness(1.3)}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes flick{0%,100%{opacity:1}50%{opacity:.75}55%{opacity:1}60%{opacity:.4}}@keyframes needle{0%,100%{transform:rotate(-60deg)}50%{transform:rotate(55deg)}}@keyframes spray{0%,100%{opacity:.1}50%{opacity:.8}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mech{animation:walk 6s ease-in-out infinite}
.stl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin:10px 0}
.st{border:4px solid var(--tx);border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;background:#ffffff06;min-width:190px;transition:.15s;overflow:hidden}
.st:hover{border-color:var(--cy);box-shadow:0 0 20px #00e5ff44}
.st1{flex:285 1 0;aspect-ratio:2/3}.st2{flex:478 1 0;aspect-ratio:1/1}.st3{flex:488 1 0;aspect-ratio:1/1}
.st.lock{opacity:.5;border-style:dashed;align-items:center;justify-content:center;text-align:center;border-color:var(--mut)}.st.nx{opacity:1}
@media(max-width:640px){.st{flex:1 1 100%!important;aspect-ratio:auto!important;min-height:220px}}
button{box-shadow:0 5px 0 #05060a,0 9px 16px #0007;border-top:1px solid #ffffff22}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #05060a,0 13px 22px #00e5ff44}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #05060a}
.pri{box-shadow:0 5px 0 #6b0c27,0 9px 16px #0007}.cy{box-shadow:0 5px 0 #003e66,0 9px 16px #0007}
.card{box-shadow:0 7px 0 #07080e,0 14px 26px #000a;border-top-color:#ffffff22;transition:transform .2s}
.card:hover{transform:perspective(900px) rotateX(2deg) translateY(-3px)}
nav{box-shadow:0 -6px 20px #000a}nav button.on{transform:translateY(-4px)}
.st{box-shadow:0 7px 0 #07080e,0 14px 26px #000a}
#menu button{border-radius:14px}
#menu h1{filter:drop-shadow(0 3px 0 #8a1030) drop-shadow(0 7px 0 #4a0a1a) drop-shadow(0 16px 14px #000);transform:perspective(600px) rotateX(14deg)}
#menu::before{content:'';position:fixed;left:-60%;right:-60%;bottom:0;height:55vh;z-index:-1;background:linear-gradient(#0000,#0b0d14f0 92%),repeating-linear-gradient(90deg,#00e5ff2a 0 2px,#0000 2px 64px),repeating-linear-gradient(0deg,#ff2d5522 0 2px,#0000 2px 64px);transform:perspective(380px) rotateX(62deg);transform-origin:bottom;animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 0,0 0,0 64px}}
@media(max-width:520px){nav button{font-size:11px;padding:6px 1px}nav button span{font-size:17px}}
</style>
</head>
<body>
<div id="menu">
  <h1>GARAGE<br>TYCOON</h1><p>Zbuduj imperium tuningowe od zera</p>
  <button class="pri" onclick="newGame()">▶ Nowa gra</button>
  <button class="cy" id="cont" onclick="cont()">⟳ Kontynuuj</button>
  <button onclick="help()">❓ Jak grać</button>
  <button onclick="toggleMute(this)">🔊 Dźwięk: wł.</button>
</div>
<div id="game">
  <header><h2 class="o" style="margin:0;font-size:18px">GARAGE TYCOON</h2><div class="row" id="stats" style="gap:6px"></div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modalbg"><div id="modal"></div></div><div id="toasts"></div>
<script>
/* ===== DANE ===== */
const CARS=[
 {id:'mikro',n:'Fiat Punto 1.2',p:4000,hp:70,hd:35,col:'#8a94a6',d:'Zwykły hatchback na start'},
 {id:'volta',n:'Volkswagen Golf GTI',p:22000,hp:200,hd:60,col:'#e63946',d:'Hot-hatch z Europy'},
 {id:'sakura',n:'Nissan Silvia S15',p:30000,hp:220,hd:75,col:'#f4a261',d:'Król driftu (JDM)'},
 {id:'kaze',n:'Mazda RX-7 FD',p:38000,hp:280,hd:70,col:'#3a86ff',d:'Japoński sportowiec'},
 {id:'alpen',n:'Audi S3 Quattro',p:52000,hp:300,hd:80,col:'#c0c8d8',d:'Napęd 4x4, bezlitosna trakcja'},
 {id:'bavaro',n:'BMW M3 E46',p:55000,hp:310,hd:78,col:'#1d3557',d:'Niemiecka precyzja'},
 {id:'thunder',n:'Dodge Charger SRT 392',p:60000,hp:450,hd:45,col:'#111',d:'Muscle car, 6.4 V8'},
 {id:'raiden',n:'Nissan Skyline GT-R R34',p:65000,hp:330,hd:82,col:'#7b2cbf',d:'Legenda tuningu (JDM)'}];
const SLOTS=[
 {k:'chip',c:'Silnik',n:'Chip tuning',o:[{n:'Stage 1',t:'Street',p:1200,hp:15}]},
 {k:'exh',c:'Silnik',n:'Układ wydechowy',o:[{n:'Sportowy',t:'Sport',p:1800,hp:20}]},
 {k:'turbo',c:'Silnik',n:'Turbo',o:[{n:'Turbo Big',t:'Race',p:6000,hp:60}]},
 {k:'susp',c:'Zawieszenie',n:'Gwinty',o:[{n:'Gwinty Sport',t:'Sport',p:2500,hd:12}]},
 {k:'stab',c:'Zawieszenie',n:'Stabilizatory',o:[{n:'Stabilizatory',t:'Street',p:1500,hd:7}]},
 {k:'brk',c:'Hamulce',n:'Hamulce',o:[{n:'Tarcze Sport',t:'Sport',p:2000,hd:8},{n:'Zestaw Race',t:'Race',p:5000,hd:15}]},
 {k:'whl',c:'Felgi',n:'Felgi i opony',o:[{n:'Złote 18"',t:'Sport',p:2200,hd:4},{n:'Czerwone 19"',t:'Race',p:4500,hd:8}]},
 {k:'spo',c:'Nadwozie',n:'Spoiler',o:[{n:'Lotka',t:'Street',p:1800},{n:'Duże skrzydło',t:'Race',p:3500,hd:3}]},
 {k:'kit',c:'Nadwozie',n:'Body kit',o:[{n:'Progi i zderzaki',t:'Sport',p:4000,hd:2}]},
 {k:'neon',c:'Wygląd',n:'Neony',o:[{n:'Neon LED',t:'Street',p:1500}]},
 {k:'aud',c:'Wnętrze',n:'Audio',o:[{n:'Nagłośnienie Pro',t:'Street',p:2000}]}];
const COLORS=['#e63946','#f4a261','#ffd60a','#2ee59d','#3a86ff','#7b2cbf','#ff2d9b','#c0c8d8','#111111','#ffffff'];
const JOBS=[['Wymiana oleju',250,1,0],['Hamulce',600,2,0],['Diagnostyka',400,2,0],['Zawieszenie',900,3,2],['Naprawa silnika',2200,4,3],['Lakierowanie',1800,3,4]];
const UPS=[
 {k:'bays',n:'Dodatkowe stanowisko',d:'+1 zlecenie dziennie',base:3000,max:4},
 {k:'tools',n:'Lepsze narzędzia',d:'Szersza strefa w minigrze',base:2500,max:4},
 {k:'dyno',n:'Hamownia',d:'Pomiar mocy przed i po tuningu',base:6000,max:1},
 {k:'paint',n:'Lakiernia',d:'Zmiana koloru auta',base:4000,max:1},
 {k:'mech',n:'Zatrudnij mechanika',d:'Robi 1 zlecenie dziennie (pensja 200 zł/dzień)',base:1500,max:3}];
/* ===== STAN ===== */
let S,view='jobs',sel=0,mute=false,G=null;
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('pl-PL')+' zł',rnd=(a,b)=>a+Math.random()*(b-a);
const lvl=()=>Math.floor((1+Math.sqrt(1+S.xp/15))/2);
function fresh(){return{cash:5000,xp:0,rep:10,day:1,earned:0,done:0,up:{bays:1,tools:0,dyno:0,paint:0,mech:0},cars:[{id:'mikro',col:'#8a94a6',parts:{},neon:'#00e5ff',spent:0}],jobs:[]}}
function save(){try{localStorage.setItem('gt_save',JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('gt_save'))}catch(e){return null}}
/* ===== DŹWIĘK ===== */
let AC;function beep(f=520,d=.08,t='square'){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function toggleMute(b){mute=!mute;b.textContent='🔊 Dźwięk: '+(mute?'wył.':'wł.')}
/* ===== UI POMOCNICZE ===== */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
function modal(h){$('#modal').innerHTML=h;$('#modalbg').style.display='flex'}
function closeModal(){$('#modalbg').style.display='none';G&&(G.stop(),G=null)}
function help(){modal(`<h3>Jak grać</h3><ol class="m"><li>W zakładce <b>Zlecenia</b> przyjmuj prace i zatrzymuj suwak w zielonej strefie (3 próby).</li><li>Zarabiaj, zdobywaj reputację i poziomy — odblokują się trudniejsze zlecenia.</li><li>W <b>Garażu</b> kupuj sportowe auta, w <b>Tuningu</b> montuj części, maluj i dodawaj neony.</li><li>W <b>Warsztacie</b> rozbudowuj stanowiska, hamownię i zatrudniaj mechaników.</li><li>Kliknij <b>Następny dzień</b>, aby odświeżyć zlecenia (płacisz czynsz i pensje).</li></ol><button class="pri" onclick="closeModal()">Jasne!</button>`)}
/* ===== START ===== */
function newGame(){S=fresh();genJobs();sel=0;view='jobs';start();help()}
function cont(){const s=load();if(!s){toast('Brak zapisu');return}S=s;start()}
function start(){$('#menu').style.display='none';$('#game').style.display='block';render()}
$('#cont').disabled=!load();
/* ===== LOGIKA ===== */
function genJobs(){const L=lvl(),pool=JOBS.filter(j=>j[3]<=L);S.jobs=[];for(let i=0;i<2+S.up.bays;i++){const j=pool[Math.floor(Math.random()*pool.length)];S.jobs.push({n:j[0],d:j[2],p:Math.round(j[1]*(1+L*.12)*rnd(.9,1.2)/10)*10,car:['Mikro','Tornado','Pixel','Duster','Combo'][Math.floor(Math.random()*5)]})}}
function gain(cash,xp,rep=0){const o=lvl();S.cash+=cash;S.earned+=Math.max(0,cash);S.xp+=xp;S.rep=Math.max(0,S.rep+rep);if(lvl()>o){toast('🏆 Awans! Poziom '+lvl());beep(900,.3,'sine')}}
function nextDay(){let rent=150*S.up.bays+200*S.up.mech;S.day++;S.cash-=rent;let msg='Dzień '+S.day+': koszty '+fmt(rent);
 for(let i=0;i<S.up.mech&&S.jobs.length;i++){const j=S.jobs.shift();gain(Math.round(j.p*.96),j.d*5);S.done++}
 const r=Math.random();if(r<.12){S.cash-=300;msg+=' · 🚔 Kontrola: mandat 300 zł'}else if(r<.24){S.cash+=800;msg+=' · 🎁 Promocja u dostawcy: +800 zł'}else if(r<.34){S.rep+=5;msg+=' · 📸 Influencer w warsztacie: +5 reputacji'}else if(r<.4){S.cash-=400;msg+=' · 🔧 Awaria narzędzia: -400 zł'}
 genJobs();toast(msg);beep(380,.15);render()}
function play(i){const j=S.jobs[i];let pos=0,dir=1,raf,r=0,sc=[];const spd=1.1+j.d*.3,z=Math.min(.45,Math.max(.1,.26-j.d*.03+S.up.tools*.04));
 const step=()=>{pos+=dir*spd*.012;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}const m=$('#mk');if(m)m.style.left=`calc(${pos*100}% - 3px)`;raf=requestAnimationFrame(step)};
 G={stop:()=>cancelAnimationFrame(raf),hit(){const d=Math.abs(pos-.5),q=d<=z/2?1:Math.max(0,1-(d-z/2)*3);sc.push(q);r++;beep(300+q*500,.1);
  if(r>=3){G.stop();G=null;const q=sc.reduce((a,b)=>a+b)/3,pay=Math.round(j.p*(.6+.6*q));gain(pay,j.d*12,q>.7?2:q<.35?-2:0);S.done++;S.jobs.splice(i,1);
  modal(`<h3>${q>.85?'⭐ Perfekcyjnie!':q>.5?'👍 Dobra robota':'😬 Słabo...'}</h3><p>Jakość: <b>${Math.round(q*100)}%</b><br>Zarobek: <b class="g">${fmt(pay)}</b></p><button class="pri" onclick="closeModal();render()">OK</button>`);render()}
  else $('#rn').textContent=r+1}};
 modal(`<h3>${j.n}</h3><p class="m">Zatrzymaj suwak w zielonej strefie. Próba <b id="rn">1</b>/3 (spacja lub przycisk)</p><div class="zone"><div id="zn" style="left:${(.5-z/2)*100}%;width:${z*100}%"></div><div id="mk"></div></div><button class="pri" style="width:100%;font-size:20px;padding:14px" onclick="G&&G.hit()">STOP!</button>`);step()}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&G){e.preventDefault();G.hit()}});
function stats(c){const b=CARS.find(x=>x.id===c.id);let hp=b.hp,hd=b.hd,look=0;for(const s of SLOTS){const o=s.o[c.parts[s.k]];if(o){hp+=o.hp||0;hd+=o.hd||0;if(['spo','kit','neon','whl'].includes(s.k))look+=1}}
 hp=Math.round(hp*(1+(c.parts.turbo!==undefined&&c.parts.chip!==undefined?.05:0)));return{hp,hd:Math.min(100,hd),look,t:Math.max(2.4,14.5-hp/36).toFixed(1),b}}
function value(c){const b=CARS.find(x=>x.id===c.id);return Math.round(b.p*.75+c.spent*.55)}
function install(k,oi){const c=S.cars[sel],o=SLOTS.find(s=>s.k===k).o[oi];if(c.parts[k]===oi){toast('Już zamontowane');return}if(S.cash<o.p){toast('❌ Za mało gotówki');return}S.cash-=o.p;c.spent+=o.p;c.parts[k]=oi;gain(0,Math.round(o.p/100));beep(700,.12,'sawtooth');toast('🔧 Zamontowano: '+o.n);render()}
function paint(col){const c=S.cars[sel];if(S.cash<300){toast('❌ Za mało gotówki');return}S.cash-=300;c.spent+=300;c.col=col;beep(600,.1,'sine');render()}
function buyCar(id){const b=CARS.find(x=>x.id===id);if(S.cash<b.p){toast('❌ Za mało gotówki');return}S.cash-=b.p;S.cars.push({id,col:b.col,parts:{},neon:'#00e5ff',spent:0});sel=S.cars.length-1;beep(800,.25,'sine');toast('🚗 Kupiono '+b.n+'!');render()}
function sellCar(i){if(S.cars.length<2){toast('Musisz zostawić jedno auto');return}const c=S.cars[i],v=value(c);modal(`<h3>Sprzedać ${CARS.find(x=>x.id===c.id).n}?</h3><p>Wycena: <b class="g">${fmt(v)}</b></p><div class="row"><button onclick="closeModal()">Anuluj</button><button class="pri" onclick="doSell(${i},${v})">Sprzedaj</button></div>`)}
function doSell(i,v){S.cars.splice(i,1);sel=0;gain(v,0);closeModal();beep(500,.2,'sine');render()}
function buyUp(k){const u=UPS.find(x=>x.k===k),n=S.up[k],cost=u.base*(k==='bays'?n:n+1);if(n>=u.max||S.cash<cost){toast('❌ Za mało gotówki');return}S.cash-=cost;S.up[k]++;beep(850,.2,'sine');toast('✅ '+u.n);render()}
function dyno(){const c=S.cars[sel],a=CARS.find(x=>x.id===c.id).hp,b=stats(c).hp,mx=Math.max(b,a)*1.15;let t=0;
 modal(`<h3>Hamownia</h3><svg viewBox="0 0 400 200" style="width:100%;background:#0006;border-radius:10px"><polyline id="l0" fill="none" stroke="#8b93aa" stroke-width="3"/><polyline id="l1" fill="none" stroke="#ff2d55" stroke-width="3"/></svg><p>Seryjnie: <b>${a} KM</b> → Teraz: <b class="g">${b} KM</b> (<span class="r">+${b-a}</span>)</p><button class="pri" onclick="closeModal()">Zamknij</button>`);
 const pts=(hp,p)=>{let s='';for(let i=0;i<=40*p;i++){const x=i/40,y=hp*Math.sin(Math.PI*Math.pow(x,.8))*(.75+.25*x);s+=`${20+x*360},${180-y/mx*160} `}return s};
 const f=()=>{t+=.02;$('#l0')&&($('#l0').setAttribute('points',pts(a,Math.min(1,t))),$('#l1').setAttribute('points',pts(b,Math.min(1,t))),beep(150+t*500,.03,'sawtooth'),t<1&&requestAnimationFrame(f))};f()}
/* ===== RYSOWANIE AUTA ===== */
function carSVG(c){const p=c.parts,w=p.whl===1?'#ff2d55':p.whl===0?'#ffcc33':'#aab',sp=p.spo;
 const wh=x=>`<circle cx="${x}" cy="124" r="29" fill="#0a0a0a"/><circle cx="${x}" cy="124" r="20" fill="${w}"/><circle cx="${x}" cy="124" r="8" fill="#222"/>`+[0,60,120].map(a=>`<line x1="${x}" y1="124" x2="${x}" y2="104" stroke="#222" stroke-width="3" transform="rotate(${a} ${x} 124)"/>`).join('');
 return`<svg class="car" viewBox="0 0 400 170"><defs><filter id="bl"><feGaussianBlur stdDeviation="9"/></filter></defs>

 <div class="grid" style="margin-top:8px">${[['Moc',st.hp+' KM',st.hp/5],['Prowadzenie',st.hd+'/100',st.hd],['0–100',st.t+' s',100-st.t*6],['Wygląd',st.look+'/4',st.look*25]].map(s=>`<div><div class="row"><span class="m">${s[0]}</span><b>${s[1]}</b></div><div class="bar"><i style="width:${Math.min(100,s[2])}%"></i></div></div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="cy" ${S.up.dyno?'':'disabled'} onclick="dyno()">📈 Hamownia${S.up.dyno?'':' (kup w Warsztacie)'}</button></div></div>`;
 h+=`<div class="card"><b>🎨 Lakier (300 zł)</b> ${S.up.paint?'':'<span class="m">– kup lakiernię w Warsztacie</span>'}<div style="${S.up.paint?'':'opacity:.4;pointer-events:none'}">${COLORS.map(x=>`<button class="sw" style="background:${x}" onclick="paint('${x}')"></button>`).join('')}</div>
 ${c.parts.neon!==undefined?`<div class="m">Kolor neonu: ${['#00e5ff','#ff2d55','#2ee59d','#ffcc33','#c77dff'].map(x=>`<button class="sw" style="background:${x}" onclick="S.cars[sel].neon='${x}';render()"></button>`).join('')}</div>`:''}</div>`;
 for(const cat of [...new Set(SLOTS.map(s=>s.c))])h+=`<h3>${cat}</h3><div class="grid">${SLOTS.filter(s=>s.c===cat).map(s=>s.o.map((o,i)=>`<div class="card"><div class="row"><b>${o.n}</b><span class="tag t-${o.t}">${o.t}</span></div><p class="m">${s.n}${o.hp?' · +'+o.hp+' KM':''}${o.hd?' · +'+o.hd+' prow.':''}</p><button class="${c.parts[s.k]===i?'':'pri'}" style="width:100%" onclick="install('${s.k}',${i})">${c.parts[s.k]===i?'✔ Zamontowane':'Kup · '+fmt(o.p)}</button></div>`).join('')).join('')}</div>`;return h}

 <h3>Salon aut</h3><div class="grid">${CARS.slice(1).map(b=>`<div class="card">${carSVG({col:b.col,parts:{},neon:''})}<div class="row"><b>${b.n}</b><span class="m">${b.hp} KM</span></div><p class="m">${b.d}</p><button class="pri" style="width:100%" onclick="buyCar('${b.id}')">Kup · ${fmt(b.p)}</button></div>`).join('')}</div>`}

<script>
/* ===== TRYB CZASU RZECZYWISTEGO ===== */
const DAY=86400000,now=()=>Date.now(),mmss=s=>{s=Math.max(0,Math.ceil(s));if(s>=3600)return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m';return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=j=>Math.round(j.d*55*(1-S.up.tools*.1))*1000,instT=o=>Math.round(o.p/30*(1-S.up.tools*.1))*1000,gap=()=>Math.max(40,110-S.rep*.5)*1000*rnd(.7,1.3)*adMul();
UPS[0].d='+1 stanowisko (równoległe naprawy)';UPS[1].d='-10% czasu napraw i montażu, szersza strefa';UPS[4].d='Sam przyjmuje klientów i naprawia (jakość 65%), 200 zł/dzień';
function fresh(){const n=now();return{cash:5000,xp:0,rep:10,day:1,earned:0,done:0,up:{bays:1,tools:0,dyno:0,paint:0,mech:0},cars:[{id:'mikro',col:'#8a94a6',parts:{},neon:'#00e5ff',spent:0}],jobs:[],bays:[null],t:n,nc:n+15000,nd:n+DAY}}
function newCust(at){const L=lvl(),pool=JOBS.filter(j=>j[3]<=L),j=pool[Math.floor(Math.random()*pool.length)];return{id:Math.random().toString(36).slice(2),n:j[0],d:j[2],p:Math.round(j[1]*(1+L*.12)*rnd(.9,1.2)/10)*10,car:['Fiat Panda','Opel Astra','Toyota Yaris','Dacia Duster','Renault Clio','Ford Focus','Skoda Octavia'][Math.floor(Math.random()*7)],col:COLORS[Math.floor(Math.random()*COLORS.length)],exp:at+rnd(240,420)*1000}}
function genJobs(){S.jobs=[newCust(now()),newCust(now())]}
function migrate(){const n=now();if(!S.bays){S.bays=[];S.nc=n+15000;S.nd=n+DAY;S.t=n}while(S.bays.length<S.up.bays)S.bays.push(null);S.jobs.forEach(j=>{if(!j.exp)j.exp=n+300000;if(!j.col)j.col='#8a94a6'});
 S.bays.forEach((b,i)=>{if(b&&b.q===null){S.jobs.unshift(b.j);S.bays[i]=null}});const lim=n-10800000;if(S.nc<lim)S.nc=lim;if(S.nd<lim)S.nd=lim}
function tick(silent){const n=now(),ev=[];let ch=0;
 while(S.nc<=n){if(S.jobs.length<3+S.up.bays){S.jobs.push(newCust(S.nc));ch=1}S.nc+=gap()}
 const bf=S.jobs.length;S.jobs=S.jobs.filter(j=>j.exp>n);if(S.jobs.length<bf){S.rep=Math.max(0,S.rep-(bf-S.jobs.length));ev.push('😠 Klient zniecierpliwiony odszedł (-rep)');ch=1}
 S.bays.forEach((b,i)=>{if(b&&b.end<=n){const pay=Math.round(b.j.p*(.6+.6*b.q));gain(pay,b.j.d*12,b.q>.7?2:b.q<.35?-2:0);S.done++;S.bays[i]=null;ev.push(`✅ ${b.j.n} (${b.j.car}): +${fmt(pay)}`)}});
 S.bays.forEach((b,i)=>{const w=S.staff.find(w=>w.bay===i);if(!b&&w&&S.jobs.length){const j=S.jobs.shift();S.bays[i]={j,q:QS[w.stars],start:n,end:n+Math.round(dur(j)*SP[w.stars]),auto:1,w:w.name,stars:w.stars};ch=1}});
 S.cars.forEach(c=>{if(c.busy&&c.busy.end<=n){const o=SLOTS.find(s=>s.k===c.busy.k).o[c.busy.oi];c.parts[c.busy.k]=c.busy.oi;gain(0,Math.round(o.p/100));ev.push('🔧 '+CARS.find(x=>x.id===c.id).n+': zamontowano '+o.n);c.busy=null}});
 while(S.nd<=n){S.day++;const r=150*S.up.bays+S.staff.reduce((a,w)=>a+w.wage,0);S.cand=genCand();S.cash-=r;let m='📅 Dzień '+S.day+': koszty '+fmt(r),x=Math.random();if(x<.12){S.cash-=300;m+=' · 🚔 mandat 300 zł'}else if(x<.24){S.cash+=800;m+=' · 🎁 promocja +800 zł'}else if(x<.34){S.rep+=5;m+=' · 📸 influencer +5 rep.'}else if(x<.4){S.cash-=400;m+=' · 🔧 awaria -400 zł'}ev.push(m);S.nd+=DAY}
 S.t=n;if(ev.length||ch){if(!silent)ev.slice(-3).forEach(toast);if(ev.length)beep(660,.1,'sine');render()}return ev}
function upd(){document.querySelectorAll('[data-end]').forEach(e=>{e.textContent=mmss((e.dataset.end-now())/1000)});document.querySelectorAll('[data-s]').forEach(e=>{const p=Math.max(0,Math.min(1,(now()-e.dataset.s)/(e.dataset.e-e.dataset.s)));if(e.dataset.w)e.setAttribute('width',e.dataset.w*p);else e.style.width=p*100+'%'})}
function start(){$('#menu').style.display='none';$('#game').style.display='block';migrate();const away=now()-S.t,ev=tick(true);
 if(away>60000&&ev.length)modal(`<h3>Podczas Twojej nieobecności</h3><p class="m">Minęło ${mmss(away/1000)}</p><div style="max-height:260px;overflow:auto">${ev.slice(-14).map(e=>`<div>${e}</div>`).join('')}</div><button class="pri" style="margin-top:12px" onclick="closeModal()">Super!</button>`);
 render();if(!window._iv){let k=0;window._iv=setInterval(()=>{if(S&&$('#game').style.display==='block'){tick();upd();if(++k%10==0)save()}},1000);addEventListener('pagehide',()=>{S&&save()})}}
function help(){modal(`<h3>Jak grać</h3><ol class="m"><li>Klienci przyjeżdżają co jakiś czas i czekają w <b>kolejce</b> (po kilku minutach odchodzą!).</li><li><b>Przyjmij</b> klienta na wolne stanowisko i zrób kontrolę wstępną (minigra) – od niej zależy wypłata.</li><li>Naprawa trwa <b>realnie</b> (minuty), także gdy zamkniesz kartę. Możesz ją przyspieszyć za gotówkę ⚡.</li><li>Montaż części w <b>Tuningu</b> też zajmuje czas. W tym czasie planuj zakupy i rozbudowę.</li><li>Co 8 minut mija dzień i płacisz czynsz oraz pensje. Mechanik 🤖 pracuje sam.</li></ol><button class="pri" onclick="closeModal()">Jasne!</button>`)}
function mini(j,cb){let pos=0,dir=1,raf,sc=[];const spd=1.1+j.d*.3,z=Math.min(.45,Math.max(.1,.26-j.d*.03+S.up.tools*.04));
 const step=()=>{pos+=dir*spd*.012;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}const m=$('#mk');if(m)m.style.left=`calc(${pos*100}% - 3px)`;raf=requestAnimationFrame(step)};
 G={stop:()=>cancelAnimationFrame(raf),hit(){const d=Math.abs(pos-.5),q=d<=z/2?1:Math.max(0,1-(d-z/2)*3);sc.push(q);beep(300+q*500,.1);if(sc.length>=3){G.stop();G=null;cb(sc.reduce((a,b)=>a+b)/3)}else $('#rn').textContent=sc.length+1}};
 modal(`<h3>${j.n}</h3><p class="m">Kontrola wstępna: zatrzymaj suwak w zielonej strefie. Próba <b id="rn">1</b>/3 (spacja lub przycisk)</p><div class="zone"><div id="zn" style="left:${(.5-z/2)*100}%;width:${z*100}%"></div><div id="mk"></div></div><button class="pri" style="width:100%;font-size:20px;padding:14px" onclick="G&&G.hit()">STOP!</button>`);step()}

 mini(j,q=>{const n=now(),b=S.bays[bi];b.q=q;b.start=n;b.end=n+dur(j);modal(`<h3>${q>.85?'⭐ Świetna diagnoza!':q>.5?'👍 Dobrze':'😬 Średnio...'}</h3><p>Jakość: <b>${Math.round(q*100)}%</b><br>Naprawa potrwa <b>${mmss(dur(j)/1000)}</b>, wypłata <b class="g">${fmt(Math.round(j.p*(.6+.6*q)))}</b>.</p><button class="pri" onclick="closeModal();render()">OK</button>`);render()})}

<script>
/* ===== STANOWISKA-PROSTOKĄTY + PRACOWNICY ===== */
const SP=[0,1.8,1.5,1.2,1,.8],QS=[0,.35,.5,.65,.8,.95],WG=[0,80,140,220,340,520],NM=['Marek','Kasia','Tomek','Ola','Piotr','Ania','Kuba','Zosia','Bartek','Ewa','Darek','Magda'];
const starS=n=>'★'.repeat(n)+'☆'.repeat(5-n);
UPS.splice(4,1);TABS.splice(3,0,['staff','👷','Pracownicy']);
function genCand(){const rp=(S&&S.rep)||0,out=[];for(let i=0;i<3+(rp>40?1:0);i++){const r=Math.random()+Math.min(.3,rp/300),s=r<.3?1:r<.55?2:r<.78?3:r<.93?4:5;out.push({id:Math.random().toString(36).slice(2),name:NM[Math.floor(Math.random()*NM.length)],stars:s,wage:WG[s],fee:WG[s]*5})}return out}
const _fr=fresh;fresh=function(){const s=_fr();s.staff=[];s.cand=genCand();return s};
const _mg=migrate;migrate=function(){if(!S.staff){S.staff=[];for(let i=0;i<S.up.mech;i++)S.staff.push({id:'m'+i,name:NM[i],stars:3,wage:WG[3],bay:i<S.up.bays?i:null})}_mg();if(!S.cand)S.cand=genCand();S.up.mech=S.staff.length};
function help(){modal(`<h3>Jak grać</h3><ol class="m"><li>Klienci wpadają do <b>kolejki</b> i odjeżdżają, jeśli zbyt długo czekają.</li><li><b>Kliknij stanowisko</b> (prostokąt): możesz naprawić auto sam (minigra) albo <b>zatrudnić pracownika</b>, który będzie tam pracował automatycznie.</li><li>Pracownicy mają <b>1–5 ★</b>: im więcej gwiazdek, tym szybciej i lepiej naprawiają, ale tym wyższa pensja dzienna.</li><li>Naprawy i montaż części trwają realnie, także gdy zamkniesz kartę. Możesz je przyspieszyć za gotówkę ⚡.</li><li>Co 8 minut mija dzień: czynsz i pensje.</li></ol><button class="pri" onclick="closeModal()">Jasne!</button>`)}
function accept(i,bi){if(bi==null)bi=S.bays.findIndex((b,k)=>!b&&!S.staff.some(w=>w.bay===k));if(bi<0||S.bays[bi]){toast('⛔ Stanowisko zajęte');return}if(S.staff.some(w=>w.bay===bi)){toast('👷 To stanowisko obsługuje pracownik');return}const j=S.jobs.splice(i,1)[0];if(!j)return;S.bays[bi]={j,q:null};render();
 mini(j,q=>{const n=now(),b=S.bays[bi];b.q=q;b.start=n;b.end=n+dur(j);modal(`<h3>${q>.85?'⭐ Świetna diagnoza!':q>.5?'👍 Dobrze':'😬 Średnio...'}</h3><p>Jakość: <b>${Math.round(q*100)}%</b><br>Naprawa potrwa <b>${mmss(dur(j)/1000)}</b>, wypłata <b class="g">${fmt(Math.round(j.p*(.6+.6*q)))}</b>.</p><button class="pri" onclick="closeModal();render()">OK</button>`);render()})}
function hire(id,bi){const c=S.cand.find(c=>c.id===id);if(!c)return;if(bi==null)bi=S.bays.findIndex((b,k)=>!S.staff.some(w=>w.bay===k));if(bi<0||S.staff.some(w=>w.bay===bi)){toast('⛔ Brak stanowiska bez pracownika – kup nowe lub zwolnij kogoś');return}if(S.cash<c.fee){toast('❌ Za mało gotówki');return}S.cash-=c.fee;S.cand=S.cand.filter(x=>x!==c);S.staff.push({id:c.id,name:c.name,stars:c.stars,wage:c.wage,bay:bi});S.up.mech=S.staff.length;beep(850,.2,'sine');toast('👷 Zatrudniono: '+c.name+' ('+c.stars+'★) → stanowisko '+(bi+1));closeModal();tick();render()}
function fire(id){S.staff=S.staff.filter(w=>w.id!==id);S.up.mech=S.staff.length;toast('Zwolniono pracownika');render()}
function assign(id,bi){S.staff.forEach(o=>{if(o.bay===bi)o.bay=null});S.staff.find(w=>w.id===id).bay=bi;closeModal();tick();render()}
function assignMenu(id){modal(`<h3>Przypisz do stanowiska</h3><div style="display:grid;gap:8px">${S.bays.map((b,i)=>`<button class="cy" onclick="assign('${id}',${i})">Stanowisko ${i+1}${S.staff.find(w=>w.bay===i)?' (zajmie miejsce: '+S.staff.find(w=>w.bay===i).name+')':''}</button>`).join('')}<button onclick="closeModal()">Anuluj</button></div>`)}
const candRow=(c,bi)=>`<div class="row" style="margin:6px 0"><span><b>${c.name}</b> <span style="color:var(--warn)">${starS(c.stars)}</span><br><span class="m">szybkość ×${(1/SP[c.stars]).toFixed(1)} · jakość ${Math.round(QS[c.stars]*100)}% · ${fmt(c.wage)}/dzień</span></span><button class="cy" onclick="hire('${c.id}'${bi==null?'':','+bi})">Zatrudnij · ${fmt(c.fee)}</button></div>`;
function openBay(bi){const b=S.bays[bi],w=S.staff.find(w=>w.bay===bi);let h=`<h3>Stanowisko ${bi+1}</h3>`;
 if(b&&b.q!==null){h+=`<p>${b.j.n} · ${b.j.car}${b.w?'<br>👷 '+b.w+' '+starS(b.stars):''}</p><div class="row"><b class="tm o" data-end="${b.end}"></b><span class="g">${fmt(Math.round(b.j.p*(.6+.6*b.q)))}</span></div><div class="bar"><i data-s="${b.start}" data-e="${b.end}"></i></div><button class="cy" style="margin-top:10px" onclick="closeModal();rush(${bi})">⚡ Przyspiesz · ${fmt(Math.ceil((b.end-now())/500))}</button>`}
 else if(b){h+='<p class="m">Trwa kontrola wstępna…</p>'}
 else if(w){h+=`<div class="card"><b>👷 ${w.name}</b> <span style="color:var(--warn)">${starS(w.stars)}</span><p class="m">Pracuje tu automatycznie – podejmie kolejnego klienta z kolejki. Pensja ${fmt(w.wage)}/dzień.</p><button onclick="fire('${w.id}');openBay(${bi})">Zwolnij</button></div>`}
 else{h+=`<h4 style="margin:8px 0">🔧 Napraw sam</h4>${S.jobs.map((j,i)=>`<button class="pri" style="width:100%;margin:4px 0" onclick="closeModal();accept(${i},${bi})">${j.n} · ${j.car} · ${fmt(j.p)} · ${mmss(dur(j)/1000)}</button>`).join('')||'<p class="m">Brak klientów w kolejce.</p>'}<h4 style="margin:12px 0 4px">👷 Zatrudnij pracownika</h4>${S.cand.map(c=>candRow(c,bi)).join('')||'<p class="m">Brak kandydatów – nowi jutro.</p>'}`}
 h+='<button style="margin-top:12px" onclick="closeModal()">Zamknij</button>';modal(h);upd()}
function stHTML(i){const k=['st1','st2','st3','st3'][i];
 if(i>=S.bays.length){const nx=i===S.bays.length;return`<div class="st ${k} lock ${nx?'nx':''}" ${nx?`onclick="buyUp('bays')"`:''}><div class="o" style="font-size:34px">${nx?'＋':'🔒'}</div><div class="m">${nx?'Nowe stanowisko · '+fmt(UPS[0].base*S.up.bays):'Zablokowane'}</div></div>`}
 const b=S.bays[i],w=S.staff.find(w=>w.bay===i);
 return`<div class="st ${k}" onclick="openBay(${i})"><div class="row"><b class="o">#${i+1}</b>${w?`<span class="tag">👷 ${w.name} <span style="color:var(--warn)">${starS(w.stars)}</span></span>`:'<span class="tag">brak pracownika</span>'}</div>${b&&b.q!==null?`${carSVG({col:b.j.col||'#8a94a6',parts:{},neon:''})}<div><div class="row"><b>${b.j.n}</b><b class="tm o" data-end="${b.end}"></b></div><div class="bar"><i data-s="${b.start}" data-e="${b.end}"></i></div></div>`:b?'<div class="m">Kontrola wstępna…</div>':'<div class="m" style="text-align:center">Wolne<br>Kliknij, by naprawić auto lub zatrudnić pracownika</div>'}</div>`}
function vJobs(){const xp=S.xp%120;return`<div class="card"><div class="row"><b>Postęp do poz. ${lvl()+1}</b><span class="m">${xp}/120 XP</span></div><div class="bar"><i style="width:${xp/1.2}%"></i></div></div>
<div class="row"><h3>🏭 Stanowiska</h3><span class="m">kliknij prostokąt</span></div><div class="stl">${[0,1,2,3].map(stHTML).join('')}</div>
<div class="row"><h3>🚗 Kolejka klientów</h3><span class="m">następny za <b class="tm" data-end="${S.nc}"></b></span></div>
<div class="grid">${S.jobs.map(j=>`<div class="card"><div class="row"><b>${j.n}</b><span class="g">${fmt(j.p)}</span></div><p class="m">${j.car} · ${'★'.repeat(j.d)}${'☆'.repeat(4-j.d)} · naprawa ${mmss(dur(j)/1000)} · odjedzie za <b class="tm" data-end="${j.exp}"></b></p></div>`).join('')||'<div class="card m">Brak klientów – poczekaj na następnego.</div>'}</div>`}
function vStaff(){return`<h3>👷 Zatrudnieni (${S.staff.length}/${S.bays.length})</h3><div class="grid">${S.staff.map(w=>`<div class="card"><div class="row"><b>${w.name}</b><span style="color:var(--warn)">${starS(w.stars)}</span></div><p class="m">Szybkość ×${(1/SP[w.stars]).toFixed(1)} · jakość ${Math.round(QS[w.stars]*100)}%<br>Pensja ${fmt(w.wage)}/dzień · ${w.bay==null?'nieprzypisany':'stanowisko '+(w.bay+1)}</p><div class="row"><button class="cy" onclick="assignMenu('${w.id}')">Przypisz</button><button onclick="fire('${w.id}')">Zwolnij</button></div></div>`).join('')||'<div class="card m">Nikogo jeszcze nie zatrudniasz.</div>'}</div>
<div class="row"><h3>📋 Kandydaci</h3><span class="m">nowi o końcu dnia: <b class="tm" data-end="${S.nd}"></b></span></div><div class="card">${S.cand.map(c=>candRow(c)).join('')||'<span class="m">Brak kandydatów – nowi jutro.</span>'}<p class="m">1★ = wolno i słabo, ale tanio · 5★ = szybko i perfekcyjnie, ale drogo.</p></div>`}
